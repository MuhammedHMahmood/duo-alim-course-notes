name: Daily pipeline

on:
  schedule:
    # 6:00 AM Pacific (PDT, UTC-7). Drifts to 5:00 AM during PST (winter) since GitHub
    # Actions cron is fixed UTC and doesn't follow daylight saving.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # CPU transcription of one lecture can take a while — well within GitHub's free
    # minutes (unlimited on this public repo), just needs a generous job ceiling.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: DEBUG Claude CLI auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          which claude
          claude --version
          set +e
          echo "Say hello in exactly two words." | claude -p --model claude-sonnet-4-6 --output-format text --max-turns 1
          echo "EXIT CODE: $?"
          set -e

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run daily pipeline
        env:
          DUO_CLASSES_YAML: ${{ secrets.DUO_CLASSES_YAML }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Draws from the Pro/Max subscription's included usage, not metered API
          # billing — generate with `claude setup-token` (see CLAUDE.md). Do NOT also
          # set ANTHROPIC_API_KEY here: it takes precedence and switches to paid billing.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >
          python duo.py pipeline --active-only
          --transcribe-backend cpu
          --backend cli
          --commit
